[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-translator-backend"
version = "0.1.0"
description = "API privée de l'Atelier documentaire"
requires-python = ">=3.12,<3.13"
readme = "../README.md"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.3",
  "uvicorn[standard]==0.54.0",
  "celery==5.6.3",
  "redis==8.1.0",
  "boto3==1.43.108",
  "psycopg[binary]==3.3.6",
  "pymupdf==1.28.2",
  "pillow==12.3.0",
  "pytesseract==0.3.13",
  "langdetect==1.0.9",
  "wordfreq==3.1.1",
  "python-docx==1.2.0",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "argon2-cffi==25.1.0",
  "numpy==2.5.3",
  "opencv-python-headless==4.13.0.92",
  "transformers==5.19.0",
  "jinja2==3.1.6",
  "tokenizers==0.23.2",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["runtime", "dataset"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
