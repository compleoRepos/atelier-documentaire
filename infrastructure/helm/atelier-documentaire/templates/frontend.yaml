apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atelier.fullname" . }}-frontend
  labels: {{- include "atelier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "atelier.name" . }}-frontend, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "atelier.name" . }}-frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ include "atelier.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: "{{ .Values.frontend.imageRepository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atelier.fullname" . }}-frontend
  labels: {{- include "atelier.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ include "atelier.name" . }}-frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.frontend.port }}, targetPort: http }]
